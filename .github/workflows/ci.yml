# Runs on every pull request and every push to main, so a change that breaks the tests or the
# type check shows a red cross on the pull request before it is merged.
#
# The backend job runs only the tests that work offline (email templates and the reminder
# schedulers). The other backend tests call the live server, so they are not run here.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (type check and tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint (errors only)
        run: npx eslint . --quiet
      - name: Tests
        run: npx jest --ci

  backend:
    name: Backend (offline tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Offline tests
        env:
          # conftest.py insists on this being set; these tests never call it.
          EXPO_PUBLIC_BACKEND_URL: http://localhost
        run: python -m pytest tests/test_email_service.py tests/test_lesson_reminders.py tests/test_admin_reminders.py tests/test_slot_alerts.py tests/test_referral_rules.py tests/test_payment_reminders.py tests/test_ai_settings.py tests/test_ai_debriefs.py -q

  secrets:
    name: Secrets scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Reports only for now: it scans the whole history, so a first run may flag old keys.
    # Look at the result, rotate anything real, then remove this line to make it a gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
