# Weekly pull requests for out-of-date dependencies, grouped so they arrive as a few PRs
# rather than dozens. Each one goes through the same checks as any other pull request.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Expo pins the versions of its own packages to the SDK. Upgrade those with
    # `npx expo install`, not by bumping them one at a time.
    ignore:
      - dependency-name: expo
      - dependency-name: "expo-*"
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: react-native
      - dependency-name: "react-native-*"
      # Native modules that Expo also pins to the SDK, but whose names are scoped so the patterns above miss them
      # (Skia 2.14 needs react-native-worklets 0.7; the SDK 54 set ships 0.5). Upgrade with the SDK.
      - dependency-name: "@shopify/react-native-skia"
      - dependency-name: "@react-native-community/*"
      - dependency-name: "@react-native-async-storage/*"

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
