[build]
  command = "npm install && npx expo export --platform web"
  publish = "dist"

# expo-router's static export already produces a real .html file per screen
# (confirmed during testing — 27 screens, each pre-rendered). This redirect
# is just a safety net for any path that doesn't match one of those files.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404

# Built JavaScript, fonts and images have a content hash in their file name, so they
# can be cached for a year; a new deploy gets new names. Repeat visits then skip the
# ~3 MB download.
[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
